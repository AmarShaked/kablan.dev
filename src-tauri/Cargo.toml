[package]
# Versioned independently of the workspace: this number is what the updater compares
# against the copy a person already has installed.
name = "kablan-desktop"
version = "0.5.0"
edition = "2024"
description = "Kablan — run coding agents against your repositories from a board"
authors = ["Shaked Amar"]
license = "Apache-2.0"
default-run = "kablan-desktop"

[[bin]]
name = "kablan-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The desktop app is the same server in the same process — not a sidecar. Both halves are Rust,
# so bundling a second binary would only add a spawn to get wrong.
server = { path = "../crates/server" }
utils = { path = "../crates/utils" }
deployment = { path = "../crates/deployment" }

tauri = { version = "=2.10.3", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Pinned as a set, deliberately. tauri-runtime-wry 2.11 raises its rust-version above the
# toolchain this repo pins, so cargo silently keeps runtime-wry at 2.10 while letting
# tauri-runtime float to 2.11 — and the two no longer implement the same trait. Naming both
# holds them in step. Raise them together when the toolchain moves.
tauri-runtime = "=2.10.1"
wry = "=0.54.0"
tokio = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[features]
default = []
