[package]
name = "kablan-app"
version = "0.1.1"
edition = "2021"
description = "Kablan.dev — your local dev environment, under one roof"
authors = ["Shaked Amar"]
license = "MIT"
default-run = "kablan-app"

[lib]
name = "kablan"
path = "src/lib.rs"

# Standalone backend binary — used by the test suite for behavioral parity.
# Build with `--no-default-features` to skip the Tauri/GUI dependencies.
[[bin]]
name = "kablan-server"
path = "src/bin/kablan-server.rs"

# The desktop app (requires the `app` feature, which is enabled by default).
[[bin]]
name = "kablan-app"
path = "src/main.rs"
required-features = ["app"]

[features]
default = ["app"]
app = ["dep:tauri", "dep:tauri-build"]

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["cors", "fs"] }
dirs = "5"
futures-util = "0.3"
tauri = { version = "2", optional = true , features = [] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
