[package]
name = "kablan-app"
version = "0.4.1"
edition = "2021"
description = "Kablan.dev — your local dev environment, under one roof"
authors = ["Shaked Amar"]
license = "MIT"
default-run = "kablan-app"

[lib]
name = "kablan"
path = "src/lib.rs"

# Standalone backend binary — used by the test suite for behavioral parity.
# Build with `--no-default-features` to skip the Tauri/GUI dependencies.
[[bin]]
name = "kablan-server"
path = "src/bin/kablan-server.rs"

# The desktop app (requires the `app` feature, which is enabled by default).
[[bin]]
name = "kablan-app"
path = "src/main.rs"
required-features = ["app"]

[features]
default = ["app"]
app = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-updater", "dep:tauri-plugin-process", "dep:tauri-plugin-notification"]

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["cors", "fs"] }
dirs = "5"
futures-util = "0.3"
tauri = { version = "2", optional = true , features = [] }
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }
tauri-plugin-notification = { version = "2", optional = true }
ureq = { version = "2", features = ["json", "tls"] }
# SQLite store (sessions, executions, logs, queue, drafts) — the source of truth for agent
# state, so status can't drift in memory and survives a restart. `sqlite` bundles libsqlite3
# so no system SQLite is needed on any target; runtime-tokio matches the axum/tokio runtime.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "json", "macros", "migrate"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
httpmock = "0.7"

# keyring stores the GitLab token in the OS credential store. v3 makes every
# platform backend opt-in — with none enabled it silently falls back to an
# in-memory mock that never persists, so a native backend MUST be selected per
# target (macOS Keychain / Windows Credential Manager / Linux Secret Service).
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

# async-secret-service (zbus, pure Rust) rather than sync-secret-service, so the
# --no-default-features `kablan-server` build has no C libdbus dependency on the
# Linux CI runner. keyring bridges its sync API over async-io internally.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["async-secret-service", "crypto-rust", "async-io"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
