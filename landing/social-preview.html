<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="fonts.css" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { width: 1280px; height: 640px; }

  body {
    background: hsl(42 30% 97%);
    color: hsl(0 0% 8%);
    font-family: 'Geist', -apple-system, system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 86px;
    position: relative;
    overflow: hidden;
  }

  /* The three columns of the app, hinted at the right edge rather than drawn. */
  .columns {
    position: absolute;
    inset: 0 0 0 auto;
    width: 300px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    opacity: 0.5;
  }
  .columns span { border-left: 1px solid hsl(42 10% 85%); }

  .mark { display: flex; align-items: center; gap: 18px; margin-bottom: 40px; }
  .mark svg { width: 68px; height: 68px; }
  .mark b { font-size: 44px; font-weight: 500; letter-spacing: -1.4px; }

  h1 {
    font-size: 60px;
    font-weight: 500;
    line-height: 1.1;
    letter-spacing: -2.4px;
    max-width: 900px;
  }
  h1 em { font-style: normal; color: hsl(34 100% 42%); }

  p {
    margin-top: 26px;
    font-size: 25px;
    font-weight: 300;
    line-height: 1.45;
    color: hsl(39 6% 38%);
    max-width: 820px;
  }

  .cmd {
    margin-top: 44px;
    display: inline-flex;
    align-items: center;
    gap: 14px;
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 27px;
    font-weight: 500;
    padding: 16px 26px;
    border: 1px solid hsl(42 10% 82%);
    border-radius: 2px;
    background: hsl(42 24% 94%);
    align-self: flex-start;
  }
  .cmd i { font-style: normal; color: hsl(34 100% 42%); }

  .foot {
    position: absolute;
    left: 86px;
    bottom: 48px;
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: hsl(39 6% 50%);
  }
</style>
</head>
<body>

<div class="columns"><span></span><span></span><span></span></div>

<div class="mark">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <mask id="n" maskUnits="userSpaceOnUse" x="-50" y="-50" width="200" height="200">
      <rect x="-50" y="-50" width="200" height="200" fill="#fff"/>
      <circle cx="31" cy="50" r="10" fill="#000"/>
    </mask>
    <g mask="url(#n)">
      <path d="M31 17 V83" stroke="#141414" stroke-width="9.4" stroke-linecap="round"/>
      <path d="M33 50 L66 22" stroke="#FF8C00" stroke-width="9.4" stroke-linecap="round"/>
      <path d="M33 50 L66 81" stroke="#141414" stroke-width="9.4" stroke-linecap="round"/>
    </g>
    <circle cx="31" cy="50" r="10" fill="none" stroke="#141414" stroke-width="6.6"/>
    <circle cx="69" cy="19" r="8.6" fill="#FF8C00"/>
  </svg>
  <b>Kablan</b>
</div>

<h1>Run several coding agents <em>at once</em>.</h1>

<p>
  Each task gets its own git worktree and branch, so agents never collide.
  Review the diff, run the app, merge or open a PR.
</p>

<div class="cmd"><i>$</i> npx kablan</div>

<div class="foot">Claude Code · Codex · Gemini · Cursor · Amp · OpenCode</div>

</body>
</html>
