name: Test

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - .github/workflows/**
      - '!.github/workflows/test.yml'
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: 22
  PNPM_VERSION: 10.13.1
  RUST_TOOLCHAIN: nightly-2025-12-04
  # This repo has no self-hosted or third-party runners registered. Any label other
  # than a GitHub-hosted one leaves every job queued forever instead of failing.
  RUNNER_LABEL: &runner_label ubuntu-latest

jobs:
  # `secrets` cannot be read from a job-level `if`, so expose presence as an output.
  secret-availability:
    runs-on: *runner_label
    outputs:
      has_vk_deploy_key: ${{ steps.probe.outputs.has_vk_deploy_key }}
    steps:
      - name: Check for private dependency deploy key
        id: probe
        env:
          VK_PRIVATE_DEPLOY_KEY: ${{ secrets.VK_PRIVATE_DEPLOY_KEY }}
        run: |
          if [ -n "$VK_PRIVATE_DEPLOY_KEY" ]; then
            echo "has_vk_deploy_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_vk_deploy_key=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VK_PRIVATE_DEPLOY_KEY is not set; skipping backend-remote-checks."
          fi

  frontend-checks:
    runs-on: *runner_label
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: pnpm install

      - name: Run frontend checks
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          npx concurrently \
            --kill-others-on-fail \
            --names "lint,i18n,fmt,build" \
            --timings \
            "cd frontend && npm run lint" \
            "GITHUB_BASE_REF=${{ github.base_ref || 'main' }} ./scripts/check-i18n.sh" \
            "cd frontend && npm run format:check" \
            "cd frontend && npm run build"

  # The install path gets its own job, and its own name on the checks list, because it is
  # the only thing standing between `npx kablan` and a machine that is not ours. Inside
  # frontend-checks the result was only visible by opening the log of a job that goes red
  # for lint, i18n and formatting reasons the wrapper shares nothing with, and it could
  # never be made a required status check on its own (KAB-43).
  #
  # Deliberately no frontend build here: these tests need the npx-cli workspace package
  # and its adm-zip dependency installed, and nothing else (KAB-37).
  npx-cli-checks:
    runs-on: *runner_label
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: pnpm install

      # The installer decides what to stop and what to leave alone; getting that wrong either
      # leaves the old version serving or signals a process that is not ours.
      - name: Run npx CLI tests
        run: npm run test:cli

  backend-schema-checks:
    runs-on: *runner_label
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/actions/cargo-checks-common-setup
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          cache-key: backend-schema-checks-${{ runner.os }}-${{ runner.arch }}-${{ env.RUNNER_LABEL }}
          setup-node: 'true'
          setup-sqlx-cli: 'true'

      - name: Check generated types
        run: npm run generate-types:check

      - name: Sqlx checks
        run: npm run prepare-db:check

  # crates/remote pulls `billing` from BloopAI/vibe-kanban-private over SSH. Without that
  # deploy key the job cannot check out its dependencies, so skip it rather than fail red.
  backend-remote-checks:
    needs: secret-availability
    if: ${{ needs.secret-availability.outputs.has_vk_deploy_key == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: *runner_label
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/actions/cargo-checks-common-setup
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          cache-key: backend-remote-checks-${{ runner.os }}-${{ runner.arch }}-${{ env.RUNNER_LABEL }}
          setup-node: 'true'
          setup-sqlx-cli: 'true'

      - name: Setup SSH Agent for private dependencies
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VK_PRIVATE_DEPLOY_KEY }}

      - name: Check remote Cargo.lock is up to date
        run: |
          cargo generate-lockfile --manifest-path crates/remote/Cargo.toml
          git diff --exit-code crates/remote/Cargo.lock || (echo "::error::crates/remote/Cargo.lock is out of date. Run 'cargo generate-lockfile --manifest-path crates/remote/Cargo.toml' and commit the result." && exit 1)

      - name: Check generated types
        run: npm run remote:generate-types:check

      - name: Sqlx checks
        run: npm run remote:prepare-db:check

  backend-clippy:
    runs-on: *runner_label
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/actions/cargo-checks-common-setup
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
          cache-key: backend-clippy-${{ runner.os }}-${{ runner.arch }}-${{ env.RUNNER_LABEL }}

      - name: Run Clippy and fmt checks
        run: |
          set -x
          cargo fmt --all -- --check & pid_fmt=$!
          cargo clippy --all --all-targets -- -D warnings
          wait $pid_fmt

  backend-test:
    runs-on: *runner_label
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/actions/cargo-checks-common-setup
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          cache-key: backend-test-${{ runner.os }}-${{ runner.arch }}-${{ env.RUNNER_LABEL }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Run Cargo tests
        run: cargo nextest run --workspace
