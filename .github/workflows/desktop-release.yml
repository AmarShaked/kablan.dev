name: Desktop release

# Build and publish the desktop installers, plus the signed artifacts the in-app updater reads.
#
#   git tag desktop-v0.2.0 && git push origin desktop-v0.2.0
#
# The tag prefix keeps this apart from upstream's own `v*` tags, which the fork still carries in
# its history and which must not trigger a release.
on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # One build per macOS architecture rather than a universal binary: Tauri only lipos the
          # main executable, and this app links the whole server into it.
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}

    env:
      # The workspace patches a crate from an ssh:// source. Runners have no SSH key, so cargo
      # cannot fetch it; rewriting to https lets the same lockfile resolve on CI and locally.
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      # Build against the committed .sqlx cache instead of a live database.
      SQLX_OFFLINE: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Let cargo fetch ssh:// git sources over https
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          # Matches rust-toolchain.toml. The Tauri crates are pinned to versions this supports;
          # see src-tauri/Cargo.toml before changing either.
          toolchain: nightly-2025-12-04
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.platform }}-${{ matrix.args }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts and writes latest.json. Without these the installers
          # still build, but no running copy of the app will accept the update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Kablan ${{ github.ref_name }}"
          releaseBody: |
            Download the installer for your platform below.

            Builds are unsigned by Apple and Microsoft: macOS needs a right-click → Open on first
            launch, and Windows SmartScreen needs "More info" → "Run anyway".
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
