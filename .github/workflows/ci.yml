name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Frontend + Node server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit -p .
      - name: Build frontend
        run: npm run build
      - name: Server test suite (Node reference)
        run: npm run test:server

  rust:
    name: Rust backend parity tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: npm ci
      - name: Same 64 tests, against the Rust binary
        run: npm run test:server:rust
