# PocketBase for Kablan chats — separate Fly app from the Kablan binary.
#
#   fly apps create kablan-pocketbase
#   fly volumes create pb_data --region ams --size 1
#   fly secrets set PB_ENCRYPTION_KEY="$(openssl rand -base64 32)"
#   fly deploy
#
# Kablan server defaults to this app + the agent@kablan.service account
# (see crates/server/src/pocketbase.rs). Optional overrides:
#   POCKETBASE_URL / POCKETBASE_SERVICE_EMAIL / POCKETBASE_SERVICE_PASSWORD
# Frontend:
#   VITE_POCKETBASE_URL=https://kablan-pocketbase.fly.dev

app = "kablan-pocketbase"
primary_region = "ams"

[build]

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

[[mounts]]
  source = "pb_data"
  destination = "/pb_data"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
